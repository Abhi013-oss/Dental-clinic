<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="coatGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="scrubGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad4)" />
  <circle cx="200" cy="180" r="140" fill="#ffffff" opacity="0.05" />
  
  <!-- Shoulders & Coat -->
  <path d="M 60 500 C 60 380, 100 320, 200 320 C 300 320, 340 380, 340 500 Z" fill="url(#coatGrad4)" />
  <!-- V-Neck Scrub Top -->
  <path d="M 155 320 L 200 410 L 245 320 Z" fill="url(#scrubGrad4)" />
  
  <!-- Stethoscope around neck -->
  <path d="M 130 320 Q 200 450 270 320" fill="none" stroke="#1e1b4b" stroke-width="12" stroke-linecap="round" />
  <circle cx="200" cy="425" r="16" fill="#6366f1" stroke="#ffffff" stroke-width="4" />
  
  <!-- Neck -->
  <rect x="170" y="240" width="60" height="90" rx="12" fill="#e2e8f0" />
  
  <!-- Head & Face -->
  <ellipse cx="200" cy="170" rx="65" ry="80" fill="#f1f5f9" />
  <!-- Hair -->
  <path d="M 135 160 C 135 90, 265 90, 265 160 C 265 110, 135 110, 135 160 Z" fill="#0f172a" />
  
  <!-- Warm Confident Smile -->
  <path d="M 175 205 Q 200 230 225 205" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Badge Label -->
  <rect x="30" y="440" width="340" height="42" rx="10" fill="#ffffff" opacity="0.95" />
  <text x="200" y="466" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4338ca" text-anchor="middle">DR. VIKRANT</text>
</svg>
