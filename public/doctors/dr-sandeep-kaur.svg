<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="coatGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="scrubGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad3)" />
  <circle cx="200" cy="180" r="140" fill="#ffffff" opacity="0.05" />
  
  <!-- Shoulders & Coat -->
  <path d="M 60 500 C 60 380, 100 320, 200 320 C 300 320, 340 380, 340 500 Z" fill="url(#coatGrad3)" />
  <!-- Inner Scrub Top -->
  <path d="M 160 320 L 200 400 L 240 320 Z" fill="url(#scrubGrad3)" />
  
  <!-- Stethoscope around neck -->
  <path d="M 135 320 Q 200 440 265 320" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
  <circle cx="200" cy="415" r="15" fill="#14b8a6" stroke="#ffffff" stroke-width="4" />
  
  <!-- Neck -->
  <rect x="175" y="240" width="50" height="90" rx="10" fill="#f8fafc" />
  
  <!-- Head & Face -->
  <ellipse cx="200" cy="175" rx="60" ry="75" fill="#ffffff" />
  
  <!-- Hair -->
  <path d="M 130 155 C 125 75, 275 75, 270 155 C 275 230, 255 310, 245 330 C 230 310, 245 210, 230 155 C 230 115, 170 115, 170 155 C 155 210, 170 310, 155 330 C 145 310, 125 230, 130 155 Z" fill="#1e293b" />
  
  <!-- Gentle Smile -->
  <path d="M 178 210 Q 200 232 222 210" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Badge Label -->
  <rect x="30" y="440" width="340" height="42" rx="10" fill="#ffffff" opacity="0.95" />
  <text x="200" y="466" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0d9488" text-anchor="middle">DR. SANDEEP KAUR</text>
</svg>
